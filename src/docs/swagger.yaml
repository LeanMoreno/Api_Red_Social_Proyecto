openapi: 3.0.4
info:
  title: UnaHur Anti-Social Net API
  description: Documentación oficial para el TP de la red social.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Servidor de desarrollo local
tags:
  - name: Usuarios
    description: Gestión de usuarios del sistema
  - name: Posts
    description: Publicaciones de la red anti-social
  - name: Comentarios
    description: Interacciones en los posts
  - name: Tags
    description: Etiquetas para categorizar posts
  - name: Imágenes
    description: Gestión de imágenes de las publicaciones

paths:
  #USUARIOS#
  /usuarios:
    get:
      tags: [Usuarios]
      summary: Obtiene todos los usuarios
      responses:
        "200":
          description: Lista obtenida exitosamente
    post:
      tags: [Usuarios]
      summary: Crea un nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Usuario"
      responses:
        "201":
          description: Usuario creado exitosamente
        "400":
          description: Error en la validación de Joi

  /usuarios/{id}:
    get:
      tags: [Usuarios]
      summary: Obtiene un usuario por ID
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Usuario encontrado
        "404":
          description: Usuario no encontrado
    put:
      tags: [Usuarios]
      summary: Actualiza un usuario existente
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Usuario"
      responses:
        "200":
          description: Usuario actualizado
    delete:
      tags: [Usuarios]
      summary: Elimina un usuario por ID
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Usuario eliminado

  /usuarios/{id}/seguir/{targetId}:
    post:
      summary: Seguir a un usuario (Bonus)
      description: Asocia una relación de seguimiento donde el usuario {id} comienza a seguir al usuario {targetId}.
      tags:
        - Usuarios
      parameters:
        - name: id
          in: path
          required: true
          description: ID del usuario que realiza el seguimiento (seguidor)
          schema:
            type: integer
            example: 1
        - name: targetId
          in: path
          required: true
          description: ID del usuario a ser seguido (seguido)
          schema:
            type: integer
            example: 2
      responses:
        200:
          description: Usuario seguido con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Usuario seguido con exito"
        400:
          description: Error en los parámetros o auto-seguimiento
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Un usuario no puede seguirse a si mismo"
        404:
          description: Usuario origen o usuario a seguir no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Usuario a seguir no encontrado"
        409:
          description: El usuario ya sigue al objetivo
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Ya sigues a este usuario"
        500:
          description: Error interno del servidor

  /usuarios/{id}/dejar-de-seguir/{targetId}:
    delete:
      summary: Dejar de seguir a un usuario (Bonus)
      description: Elimina la relación de seguimiento entre el usuario {id} y el usuario {targetId}.
      tags:
        - Usuarios
      parameters:
        - name: id
          in: path
          required: true
          description: ID del usuario seguidor
          schema:
            type: integer
            example: 1
        - name: targetId
          in: path
          required: true
          description: ID del usuario que se dejará de seguir
          schema:
            type: integer
            example: 2
      responses:
        200:
          description: Ha dejado de seguir al usuario correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Has dejado de seguir al usuario Juan correctamente"
        400:
          description: IDs inválidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "El targetId debe ser un número positivo"
        404:
          description: Usuario no encontrado o no se estaba siguiendo
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "No sigues a este usuario"
        500:
          description: Error interno del servidor

  /usuarios/{id}/seguidores:
    get:
      summary: Obtener seguidores de un usuario (Bonus)
      description: Retorna la lista de usuarios que siguen al usuario indicado por {id}.
      tags:
        - Usuarios
      parameters:
        - name: id
          in: path
          required: true
          description: ID del usuario a consultar
          schema:
            type: integer
            example: 2
      responses:
        200:
          description: Lista de seguidores obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    nickName:
                      type: string
                      example: "usuario1"
        400:
          description: ID inválido
        404:
          description: Usuario no encontrado
        500:
          description: Error interno del servidor

  /usuarios/{id}/seguidos:
    get:
      summary: Obtener seguidos de un usuario (Bonus)
      description: Retorna la lista de usuarios a los que sigue el usuario indicado por {id}.
      tags:
        - Usuarios
      parameters:
        - name: id
          in: path
          required: true
          description: ID del usuario a consultar
          schema:
            type: integer
            example: 1
      responses:
        200:
          description: Lista de usuarios seguidos obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 2
                    nickName:
                      type: string
                      example: "usuario2"
        400:
          description: ID inválido
        404:
          description: Usuario no encontrado
        500:
          description: Error interno del servidor

  #POSTS#
  /posts:
    get:
      tags: [Posts]
      summary: Obtiene todos los posts
      responses:
        "200":
          description: Lista de posts obtenida
    post:
      tags: [Posts]
      summary: Crea un nuevo post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Post"
      responses:
        "201":
          description: Post creado exitosamente

  /posts/{id}:
    get:
      tags: [Posts]
      summary: Obtiene un post por ID
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Post encontrado
    put:
      tags: [Posts]
      summary: Actualiza un post por ID
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Post"
      responses:
        "200":
          description: Post actualizado
    delete:
      tags: [Posts]
      summary: Elimina un post por ID
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Post eliminado

  #RUTAS ANIDADAS (Posts -> Comentarios/Tags)#
  /posts/{id}/comentarios:
    get:
      tags: [Comentarios]
      summary: Obtiene los comentarios de un post específico
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Comentarios obtenidos

  /posts/{id}/tags/{tagId}:
    post:
      tags: [Tags]
      summary: Asigna un tag a un post
      parameters:
        - $ref: "#/components/parameters/PathId"
        - in: path
          name: tagId
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Tag asignado al post
    delete:
      tags: [Tags]
      summary: Quita un tag de un post
      parameters:
        - $ref: "#/components/parameters/PathId"
        - in: path
          name: tagId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tag removido del post

  #IMÁGENES#
  /posts/image:
    get:
      tags: [Imágenes]
      summary: Obtiene todas las imágenes de los posts
      responses:
        "200":
          description: Lista de imágenes obtenida exitosamente
    post:
      tags: [Imágenes]
      summary: Registra o sube una imagen para un post
      description: |
        Permite registrar una imagen asociada a un post:
        - **Subida local (Bonus 1 - Postman: form-data)**: En la pestaña Body seleccionar `form-data`. En Key escribir "imagen", cambiar el tipo desplegable de Text a "File", y en el campo Value seleccionar el archivo o ubicación de la imagen en tu PC (formatos permitidos: jpg, jpeg, png, webp, gif). Agregar también la fila con Key "postId" (Text) y el ID del post en Value.
        - **URL externa (Postman: raw JSON)**: Enviar JSON con los campos `url` y `postId`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - postId
                - imagen
              properties:
                postId:
                  type: integer
                  description: ID del post al que pertenece la imagen (tipo Text en form-data)
                  example: 1
                imagen:
                  type: string
                  format: binary
                  description: En Postman, colocar la palabra 'imagen' en Key, seleccionar tipo 'File' y en el campo Value elegir la ubicación de la imagen en la PC (jpg, jpeg, png, webp, gif)
          application/json:
            schema:
              $ref: "#/components/schemas/PostImage"
      responses:
        "201":
          description: Imagen creada exitosamente
        "400":
          description: Datos inválidos o archivo no permitido
        "404":
          description: Posteo no encontrado

  /posts/image/{id}:
    get:
      tags: [Imágenes]
      summary: Obtiene una imagen por ID
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Imagen encontrada
        "404":
          description: Imagen no encontrada
    put:
      tags: [Imágenes]
      summary: Actualiza una imagen por ID
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostImage"
      responses:
        "200":
          description: Imagen actualizada
        "400":
          description: Datos inválidos
        "404":
          description: Imagen o posteo no encontrado
    delete:
      tags: [Imágenes]
      summary: Elimina una imagen por ID (y su archivo local si corresponde)
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Imagen eliminada
        "404":
          description: Imagen no encontrada

components:
  parameters:
    PathId:
      name: id
      in: path
      required: true
      description: ID numérico del recurso
      schema:
        type: integer
        minimum: 1

  schemas:
    Usuario:
      type: object
      required:
        - nickName
      properties:
        nickName:
          type: string
          minLength: 3
          maxLength: 100
          example: "Juancito"

    Post:
      type: object
      required:
        - descripcion
        - userId
      properties:
        descripcion:
          type: string
          minLength: 3
          maxLength: 500
          example: "Este es mi primer post en la red anti-social."
        userId:
          type: integer
          minimum: 1
          example: 1
    PostImage:
      type: object
      required:
        - postId
      properties:
        url:
          type: string
          example: "https://images.unsplash.com/photo-1579546929518-9e396f3cc809"
        postId:
          type: integer
          example: 1
